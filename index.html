<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Bucket List — Asuka & Stepan</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: #faf9f6; color: #1a1916; font-size: 14px; }
header { background: #fff; border-bottom: 1px solid #e8e4dc; padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.logo { font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; }
.logo span { color: #c17f4a; }
.sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9e9b94; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; display: inline-block; }
.dot.live { background: #3b6d11; }
.dot.saving { background: #c17f4a; animation: blink 0.8s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.hstats { display: flex; gap: 1.5rem; margin-left: auto; }
.hstat { text-align: center; }
.hstat-n { font-size: 1.2rem; font-weight: 600; }
.hstat-l { font-size: 10px; color: #9e9b94; text-transform: uppercase; letter-spacing: 0.04em; }
.toolbar { background: #fff; border-bottom: 1px solid #e8e4dc; padding: 0.75rem 2rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input, .toolbar select { font-family: inherit; font-size: 13px; border: 1px solid #e8e4dc; border-radius: 6px; padding: 6px 10px; background: #faf9f6; color: #1a1916; outline: none; }
.toolbar input:focus, .toolbar select:focus { border-color: #c17f4a; }
.lang-btns { display: flex; border: 1px solid #e8e4dc; border-radius: 6px; overflow: hidden; }
.lang-btns button { font-family: inherit; font-size: 12px; padding: 5px 10px; border: none; background: transparent; color: #6b6860; cursor: pointer; }
.lang-btns button.on { background: #1a1916; color: #fff; }
.btn-add { font-family: inherit; font-size: 13px; font-weight: 500; background: #c17f4a; color: #fff; border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer; margin-left: auto; }
.btn-add:hover { opacity: 0.88; }
.wrap { padding: 1.5rem 2rem; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 780px; }
th { font-size: 11px; color: #9e9b94; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 10px; text-align: left; border-bottom: 1px solid #e8e4dc; cursor: pointer; white-space: nowrap; }
th:hover { color: #1a1916; }
td { padding: 10px; border-bottom: 1px solid #e8e4dc; vertical-align: middle; }
tr:hover td { background: #f4f2ed; }
tr.done td { opacity: 0.38; }
tr.done td.ns { opacity: 1; }
tr.done .ttl { text-decoration: line-through; }
.ttl { font-weight: 500; font-size: 13px; }
.sub { font-size: 11px; color: #9e9b94; margin-top: 2px; }
.pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.pri-High { background: #fcebeb; color: #a32d2d; border-radius: 4px; display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; }
.pri-Medium { background: #faeeda; color: #854f0b; border-radius: 4px; display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; }
.pri-Someday { background: #eaf3de; color: #3b6d11; border-radius: 4px; display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; }
.prop-A { background: #eeedfe; color: #3c3489; border-radius: 99px; display: inline-block; font-size: 11px; padding: 2px 8px; }
.prop-S { background: #e1f5ee; color: #085041; border-radius: 99px; display: inline-block; font-size: 11px; padding: 2px 8px; }
.prop-B { background: #e6f1fb; color: #0c447c; border-radius: 99px; display: inline-block; font-size: 11px; padding: 2px 8px; }
.bdg { color: #c17f4a; font-size: 13px; letter-spacing: 1px; }
.chip { font-size: 11px; background: #f4f2ed; color: #6b6860; padding: 2px 7px; border-radius: 4px; }
.loc { font-size: 12px; color: #6b6860; }
.ddate { font-size: 11px; color: #9e9b94; }
.alink { color: #c17f4a; font-size: 12px; text-decoration: none; }
.alink:hover { text-decoration: underline; }
.memo { font-size: 11px; color: #9e9b94; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibtn { background: none; border: none; cursor: pointer; color: #9e9b94; padding: 3px 5px; border-radius: 4px; font-size: 14px; }
.ibtn:hover { background: #f4f2ed; color: #1a1916; }
.empty { text-align: center; padding: 3rem; color: #9e9b94; }
.sarr { font-size: 10px; }
/* Modal */
.mbg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
.mbg.open { display: flex; }
.mbox { background: #fff; border-radius: 12px; padding: 1.5rem; width: 540px; max-width: 96vw; max-height: 90vh; overflow-y: auto; }
.mbox h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 1.25rem; }
.fr { margin-bottom: 12px; }
.fr label { display: block; font-size: 11px; color: #9e9b94; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.fr input, .fr select, .fr textarea { width: 100%; font-family: inherit; font-size: 13px; border: 1px solid #e8e4dc; border-radius: 6px; padding: 7px 10px; background: #faf9f6; color: #1a1916; outline: none; }
.fr input:focus, .fr select:focus, .fr textarea:focus { border-color: #c17f4a; }
.fr textarea { min-height: 56px; resize: vertical; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tgrid small { display: block; font-size: 11px; color: #9e9b94; margin-bottom: 3px; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tbtns { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.tbtn { font-family: inherit; font-size: 12px; padding: 4px 10px; border-radius: 5px; border: 1px solid #e8e4dc; background: #f4f2ed; cursor: pointer; color: #6b6860; }
.tbtn:hover { background: #e8e4dc; }
.thint { font-size: 11px; color: #9e9b94; margin-top: 4px; }
.mactions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #e8e4dc; }
.bcanel { font-family: inherit; font-size: 13px; background: transparent; border: 1px solid #e8e4dc; border-radius: 6px; padding: 7px 16px; cursor: pointer; color: #6b6860; }
.bsave { font-family: inherit; font-size: 13px; font-weight: 500; background: #c17f4a; color: #fff; border: none; border-radius: 6px; padding: 7px 18px; cursor: pointer; }
.bsave:hover { opacity: 0.88; }
</style>
</head>
<body>

<header>
  <div class="logo">Our List <span>✦</span></div>
  <div class="sync"><span class="dot" id="sdot"></span><span id="slbl">Connecting…</span></div>
  <div class="hstats" id="hstats"></div>
</header>

<div class="toolbar">
  <input type="text" id="q" placeholder="Search…" style="width:180px;" oninput="render()">
  <select id="fcat" onchange="render()">
    <option value="">All categories</option>
    <option value="food">Dining & Food</option>
    <option value="outdoor">Outdoor</option>
    <option value="travel">Travel</option>
    <option value="indoor">Indoor / Culture</option>
    <option value="adventure">Adventure</option>
    <option value="art">Art & Music</option>
    <option value="other">Other</option>
  </select>
  <select id="fdone" onchange="render()">
    <option value="">All items</option>
    <option value="false">Not done</option>
    <option value="true">Done ✓</option>
  </select>
  <select id="fpri" onchange="render()">
    <option value="">All priorities</option>
    <option value="High">High</option>
    <option value="Medium">Medium</option>
    <option value="Someday">Someday</option>
  </select>
  <div class="lang-btns">
    <button id="lt-en" class="on" onclick="setLang('en')">EN</button>
    <button id="lt-ja" onclick="setLang('ja')">JA</button>
    <button id="lt-ru" onclick="setLang('ru')">RU</button>
  </div>
  <button class="btn-add" onclick="openModal(null)">＋ Add item</button>
</div>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th style="width:36px;"></th>
        <th onclick="sortBy('title_en')">Title <span class="sarr" id="sa-title_en"></span></th>
        <th onclick="sortBy('category')">Category <span class="sarr" id="sa-category"></span></th>
        <th onclick="sortBy('priority')">Priority <span class="sarr" id="sa-priority"></span></th>
        <th onclick="sortBy('season')">Season <span class="sarr" id="sa-season"></span></th>
        <th onclick="sortBy('budget')">Budget <span class="sarr" id="sa-budget"></span></th>
        <th onclick="sortBy('proposer')">By <span class="sarr" id="sa-proposer"></span></th>
        <th>Location</th>
        <th>Ref / memo</th>
        <th onclick="sortBy('done_date')">Done <span class="sarr" id="sa-done_date"></span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="mbg" id="mbg">
  <div class="mbox" id="mbox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const cfg = {
  apiKey: "AIzaSyCqUNIBRhGMag1zsNdof6_prn2YZzys8WY",
  authDomain: "bucket-list-ea825.firebaseapp.com",
  databaseURL: "https://bucket-list-ea825-default-rtdb.firebaseio.com",
  projectId: "bucket-list-ea825",
  storageBucket: "bucket-list-ea825.firebasestorage.app",
  messagingSenderId: "872210068732",
  appId: "1:872210068732:web:f63a406c29796f40d71379"
};

const app = initializeApp(cfg);
const db = getDatabase(app);
const iref = ref(db, 'bucketlist/items');
const dot = document.getElementById('sdot');
const lbl = document.getElementById('slbl');

window._fbSet = async (id, data) => {
  dot.className = 'dot saving'; lbl.textContent = 'Saving…';
  await set(ref(db, 'bucketlist/items/' + id), data);
  dot.className = 'dot live'; lbl.textContent = 'Synced';
};
window._fbDel = async (id) => {
  dot.className = 'dot saving'; lbl.textContent = 'Saving…';
  await remove(ref(db, 'bucketlist/items/' + id));
  dot.className = 'dot live'; lbl.textContent = 'Synced';
};
window._fbPush = async (data) => {
  dot.className = 'dot saving'; lbl.textContent = 'Saving…';
  const nr = push(iref);
  await set(nr, Object.assign({}, data, {id: nr.key}));
  dot.className = 'dot live'; lbl.textContent = 'Synced';
  return nr.key;
};

onValue(iref, snap => {
  const v = snap.val();
  window._items = v ? Object.values(v) : [];
  dot.className = 'dot live'; lbl.textContent = 'Live ✓';
  render();
});
</script>

<script>
const CATS = {
  food:      {label:'Dining & Food',    bg:'#f5c4b3', t:'#712b13'},
  outdoor:   {label:'Outdoor',          bg:'#c0dd97', t:'#3b6d11'},
  travel:    {label:'Travel',           bg:'#b5d4f4', t:'#185fa5'},
  indoor:    {label:'Indoor / Culture', bg:'#cecbf6', t:'#3c3489'},
  adventure: {label:'Adventure',        bg:'#fac775', t:'#633806'},
  art:       {label:'Art & Music',      bg:'#f4c0d1', t:'#72243e'},
  other:     {label:'Other',            bg:'#d3d1c7', t:'#444441'},
};
const SEASONS  = ['Any time','Spring','Summer','Autumn','Winter'];
const PRIS     = ['High','Medium','Someday'];
const PROPS    = ['Asuka','Stepan','Both'];
const PROPMAP  = {Asuka:'A', Stepan:'S', Both:'B'};

window._items = [];
var lang = 'en';
var skey = '';
var sdir = 1;
var eid  = null;

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btns button').forEach(function(b){ b.classList.remove('on'); });
  document.getElementById('lt-' + l).classList.add('on');
  render();
}

function sortBy(k) {
  if (skey === k) sdir = -sdir; else { skey = k; sdir = 1; }
  document.querySelectorAll('.sarr').forEach(function(e){ e.textContent = ''; });
  var el = document.getElementById('sa-' + k);
  if (el) el.textContent = sdir === 1 ? ' ↑' : ' ↓';
  render();
}

function getRows() {
  var q  = document.getElementById('q').value.toLowerCase();
  var fc = document.getElementById('fcat').value;
  var fd = document.getElementById('fdone').value;
  var fp = document.getElementById('fpri').value;
  var rows = _items.filter(function(it) {
    if (fc && it.category !== fc) return false;
    if (fd !== '' && String(it.done) !== fd) return false;
    if (fp && it.priority !== fp) return false;
    if (q && !((it.title_en||'')+(it.title_ja||'')+(it.title_ru||'')+(it.location||'')+(it.memo||'')).toLowerCase().includes(q)) return false;
    return true;
  });
  if (!skey) return rows;
  var po = {High:0, Medium:1, Someday:2};
  return rows.sort(function(a,b){
    var av = a[skey]||'', bv = b[skey]||'';
    if (skey === 'priority') { av = po[av]??9; bv = po[bv]??9; return sdir*(av-bv); }
    if (skey === 'budget') return sdir*(av-bv);
    return sdir*String(av).localeCompare(String(bv));
  });
}

function dots(n) { return '●'.repeat(n)+'○'.repeat(5-n); }

function render() {
  var rows = getRows();
  var tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="11"><div class="empty">No items yet — add your first dream ✦</div></td></tr>';
    updateStats(); return;
  }
  var tkey = 'title_' + lang;
  tb.innerHTML = rows.map(function(it) {
    var cat = CATS[it.category] || CATS.other;
    var ttl = it[tkey] || it.title_en || '—';
    var pk  = 'prop-' + (PROPMAP[it.proposer]||'B');
    return '<tr class="' + (it.done ? 'done' : '') + '">'
      + '<td class="ns"><input type="checkbox"' + (it.done ? ' checked' : '') + ' onchange="toggleDone(\'' + it.id + '\')" style="accent-color:#c17f4a;width:15px;height:15px;cursor:pointer;"></td>'
      + '<td><div class="ttl">' + ttl + '</div>' + (it.location ? '<div class="sub">📍 ' + it.location + '</div>' : '') + '</td>'
      + '<td><span class="pill" style="background:' + cat.bg + ';color:' + cat.t + ';">' + cat.label + '</span></td>'
      + '<td><span class="pri-' + it.priority + '">' + it.priority + '</span></td>'
      + '<td><span class="chip">' + (it.season||'—') + '</span></td>'
      + '<td><span class="bdg" title="' + it.budget + '/5">' + dots(it.budget||1) + '</span></td>'
      + '<td><span class="' + pk + '">' + (it.proposer||'—') + '</span></td>'
      + '<td><span class="loc">' + (it.location||'—') + '</span></td>'
      + '<td>' + (it.url ? '<a class="alink" href="' + it.url + '" target="_blank">🔗 Link</a>' : '') + (it.memo ? '<div class="memo" title="' + it.memo + '">💬 ' + it.memo + '</div>' : '') + '</td>'
      + '<td class="ns"><span class="ddate">' + (it.done_date||'') + '</span></td>'
      + '<td class="ns" style="white-space:nowrap;">'
        + '<button class="ibtn" onclick="openModal(\'' + it.id + '\')" title="Edit">✏️</button>'
        + '<button class="ibtn" onclick="delItem(\'' + it.id + '\')" title="Delete">🗑</button>'
      + '</td>'
      + '</tr>';
  }).join('');
  updateStats();
}

function updateStats() {
  var t = _items.length;
  var d = _items.filter(function(x){ return x.done; }).length;
  var h = _items.filter(function(x){ return x.priority==='High' && !x.done; }).length;
  document.getElementById('hstats').innerHTML =
    '<div class="hstat"><div class="hstat-n">' + t + '</div><div class="hstat-l">Total</div></div>' +
    '<div class="hstat"><div class="hstat-n">' + d + '</div><div class="hstat-l">Done</div></div>' +
    '<div class="hstat"><div class="hstat-n">' + (t-d) + '</div><div class="hstat-l">Left</div></div>' +
    '<div class="hstat"><div class="hstat-n">' + h + '</div><div class="hstat-l">High</div></div>';
}

function toggleDone(id) {
  var it = _items.find(function(x){ return x.id===id; });
  if (!it) return;
  it.done = !it.done;
  it.done_date = it.done ? new Date().toISOString().slice(0,10) : '';
  window._fbSet(id, it);
}

function delItem(id) {
  if (!confirm('Remove this item?')) return;
  window._fbDel(id);
}

function openModal(id) {
  eid = id;
  var it = id ? _items.find(function(x){ return x.id===id; }) : null;
  var en = it ? (it.title_en||'') : '';
  var ja = it ? (it.title_ja||'') : '';
  var ru = it ? (it.title_ru||'') : '';
  var loc = it ? (it.location||'') : '';
  var url = it ? (it.url||'') : '';
  var memo = it ? (it.memo||'') : '';

  var catOpts = Object.entries(CATS).map(function(e){
    return '<option value="'+e[0]+'"'+(it&&it.category===e[0]?' selected':'')+'>'+e[1].label+'</option>';
  }).join('');
  var priOpts = PRIS.map(function(p){
    return '<option value="'+p+'"'+(it&&it.priority===p?' selected':'')+'>'+p+'</option>';
  }).join('');
  var seaOpts = SEASONS.map(function(s){
    return '<option value="'+s+'"'+(it&&it.season===s?' selected':'')+'>'+s+'</option>';
  }).join('');
  var proOpts = PROPS.map(function(p){
    return '<option value="'+p+'"'+(it&&it.proposer===p?' selected':'')+'>'+p+'</option>';
  }).join('');
  var budOpts = [1,2,3,4,5].map(function(b){
    return '<option value="'+b+'"'+(it&&it.budget===b?' selected':'')+'>'+'●'.repeat(b)+' ('+b+')</option>';
  }).join('');

  document.getElementById('mbox').innerHTML =
    '<h2>' + (id ? 'Edit item' : 'Add new item') + '</h2>' +
    '<div class="fr"><label>Title</label>' +
    '<div class="tgrid">' +
      '<div><small>English</small><input type="text" id="fen" value="' + en + '" placeholder="English"></div>' +
      '<div><small>日本語</small><input type="text" id="fja" value="' + ja + '" placeholder="日本語"></div>' +
      '<div><small>Русский</small><input type="text" id="fru" value="' + ru + '" placeholder="Русский"></div>' +
    '</div>' +
    '<div class="tbtns">' +
      '<button class="tbtn" onclick="gtrans(\'en\')">🌐 EN → others</button>' +
      '<button class="tbtn" onclick="gtrans(\'ja\')">🌐 JA → others</button>' +
      '<button class="tbtn" onclick="gtrans(\'ru\')">🌐 RU → others</button>' +
    '</div>' +
    '<div class="thint">Google翻訳が開きます。翻訳結果をコピーして各欄に貼り付けてください。</div>' +
    '</div>' +
    '<div class="f2">' +
      '<div class="fr"><label>Category</label><select id="fcat2">' + catOpts + '</select></div>' +
      '<div class="fr"><label>Priority</label><select id="fpri2">' + priOpts + '</select></div>' +
      '<div class="fr"><label>Season</label><select id="fsea">' + seaOpts + '</select></div>' +
      '<div class="fr"><label>Proposed by</label><select id="fpro">' + proOpts + '</select></div>' +
      '<div class="fr"><label>Budget (1–5)</label><select id="fbud">' + budOpts + '</select></div>' +
      '<div class="fr"><label>Location / city</label><input type="text" id="floc" value="' + loc + '" placeholder="e.g. Kyoto, Japan"></div>' +
    '</div>' +
    '<div class="fr"><label>Reference URL</label><input type="text" id="furl" value="' + url + '" placeholder="https://..."></div>' +
    '<div class="fr"><label>Memo / notes</label><textarea id="fmemo">' + memo + '</textarea></div>' +
    '<div class="mactions">' +
      '<button class="bcanel" onclick="closeModal()">Cancel</button>' +
      '<button class="bsave" onclick="saveItem()">Save</button>' +
    '</div>';

  document.getElementById('mbg').classList.add('open');
}

function closeModal() {
  document.getElementById('mbg').classList.remove('open');
}

document.getElementById('mbg').addEventListener('click', function(e){
  if (e.target === this) closeModal();
});

function gtrans(fromLang) {
  var inp = document.getElementById('f' + fromLang);
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) { alert('Please type something in the ' + fromLang.toUpperCase() + ' field first.'); return; }
  window.open('https://translate.google.com/?sl=' + fromLang + '&tl=auto&text=' + encodeURIComponent(text) + '&op=translate', '_blank');
}

function saveItem() {
  var en = document.getElementById('fen').value.trim();
  var ja = document.getElementById('fja').value.trim();
  var ru = document.getElementById('fru').value.trim();
  if (!en && !ja && !ru) { alert('Please enter a title in at least one language.'); return; }
  var ex = eid ? _items.find(function(x){ return x.id===eid; }) : null;
  var obj = {
    id: eid || null,
    title_en: en, title_ja: ja, title_ru: ru,
    category:  document.getElementById('fcat2').value,
    priority:  document.getElementById('fpri2').value,
    season:    document.getElementById('fsea').value,
    budget:    parseInt(document.getElementById('fbud').value) || 1,
    proposer:  document.getElementById('fpro').value,
    location:  document.getElementById('floc').value.trim(),
    url:       document.getElementById('furl').value.trim(),
    memo:      document.getElementById('fmemo').value.trim(),
    done:      ex ? ex.done : false,
    done_date: ex ? (ex.done_date||'') : '',
  };
  closeModal();
  if (eid) {
    window._fbSet(eid, obj);
  } else {
    window._fbPush(obj);
  }
}
</script>
</body>
</html>
