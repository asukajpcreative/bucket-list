<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Bucket List ✦ Asuka & Stepan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --surface2: #f4f2ed;
    --border: #e8e4dc;
    --text: #1a1916;
    --text2: #6b6860;
    --text3: #9e9b94;
    --accent: #c17f4a;
    --accent-light: #f7ede0;
    --cat-food: #f5c4b3; --cat-food-t: #712b13;
    --cat-outdoor: #c0dd97; --cat-outdoor-t: #3b6d11;
    --cat-travel: #b5d4f4; --cat-travel-t: #185fa5;
    --cat-indoor: #cecbf6; --cat-indoor-t: #3c3489;
    --cat-adventure: #fac775; --cat-adventure-t: #633806;
    --cat-art: #f4c0d1; --cat-art-t: #72243e;
    --cat-other: #d3d1c7; --cat-other-t: #444441;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap; background: var(--surface); }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--text); letter-spacing: -0.01em; }
  .logo span { color: var(--accent); font-style: italic; }
  .header-stats { display: flex; gap: 1.5rem; margin-left: auto; flex-wrap: wrap; }
  .hstat { text-align: center; }
  .hstat-num { font-size: 1.25rem; font-weight: 500; color: var(--text); }
  .hstat-label { font-size: 11px; color: var(--text3); letter-spacing: 0.04em; text-transform: uppercase; }

  .toolbar { padding: 1rem 2rem; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
  .toolbar input[type="text"] { font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; color: var(--text); outline: none; width: 200px; }
  .toolbar input[type="text"]:focus { border-color: var(--accent); }
  .toolbar select { font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 7px 12px; color: var(--text); outline: none; cursor: pointer; }
  .btn-add { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; background: var(--accent); color: white; border: none; border-radius: 6px; padding: 7px 16px; cursor: pointer; display: flex; align-items: center; gap: 6px; margin-left: auto; transition: opacity 0.15s; }
  .btn-add:hover { opacity: 0.88; }
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .lang-toggle button { font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 11px; border: none; background: transparent; color: var(--text2); cursor: pointer; transition: all 0.12s; }
  .lang-toggle button.active { background: var(--text); color: white; }

  .table-wrap { overflow-x: auto; padding: 1.5rem 2rem; }
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  th { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 10px; text-align: left; cursor: pointer; white-space: nowrap; border-bottom: 1px solid var(--border); }
  th:hover { color: var(--text); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; color: var(--text); }
  tr:hover td { background: var(--surface2); }
  tr.done td { opacity: 0.38; }
  tr.done td.no-strike { opacity: 1; }
  tr.done .item-title { text-decoration: line-through; }

  .item-title { font-size: 13px; font-weight: 500; max-width: 220px; }
  .item-sub { font-size: 11px; color: var(--text3); margin-top: 2px; font-style: italic; }
  .cat-pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .pri-pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; }
  .pri-High { background: #fcebeb; color: #a32d2d; }
  .pri-Medium { background: #faeeda; color: #854f0b; }
  .pri-Someday { background: #eaf3de; color: #3b6d11; }
  .prop-pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  .prop-Asuka { background: #eeedfe; color: #3c3489; }
  .prop-Stepan { background: #e1f5ee; color: #085041; }
  .prop-Both { background: #e6f1fb; color: #0c447c; }
  .budget-dots { letter-spacing: 1px; font-size: 13px; color: var(--accent); }
  .season-chip { font-size: 11px; color: var(--text2); background: var(--surface2); padding: 2px 7px; border-radius: 4px; }
  .loc-text { font-size: 12px; color: var(--text2); }
  .done-date { font-size: 11px; color: var(--text3); }
  .url-link { color: var(--accent); font-size: 12px; text-decoration: none; }
  .url-link:hover { text-decoration: underline; }
  .memo-text { font-size: 11px; color: var(--text3); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-icon { background: none; border: none; cursor: pointer; color: var(--text3); padding: 3px 5px; border-radius: 4px; font-size: 14px; transition: color 0.12s; }
  .btn-icon:hover { color: var(--text); background: var(--surface2); }
  .sort-arrow { font-size: 10px; }
  .empty-state { text-align: center; padding: 3rem; color: var(--text3); font-size: 14px; }
  .empty-state .em-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text2); margin-bottom: 0.5rem; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(26,25,22,0.5); z-index: 200; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; padding: 1.5rem; width: 540px; max-width: 96vw; max-height: 92vh; overflow-y: auto; }
  .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; margin-bottom: 1.25rem; color: var(--text); }
  .form-row { margin-bottom: 13px; }
  .form-row label { display: block; font-size: 11px; color: var(--text3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); outline: none; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }
  .form-row textarea { min-height: 58px; resize: vertical; }
  .translate-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .tl-status { font-size: 10px; color: var(--accent); min-height: 14px; margin-top: 2px; font-style: italic; }
  .form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .btn-cancel { font-family: 'DM Sans', sans-serif; font-size: 13px; background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 7px 16px; cursor: pointer; color: var(--text2); }
  .btn-save { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; background: var(--accent); color: white; border: none; border-radius: 6px; padding: 7px 18px; cursor: pointer; }
  .btn-save:hover { opacity: 0.88; }

  /* Sync indicator */
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; display: inline-block; margin-right: 6px; }
  .sync-dot.connected { background: #3b6d11; }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .sync-label { font-size: 11px; color: var(--text3); display: flex; align-items: center; }

  @media (max-width: 600px) {
    header, .toolbar, .table-wrap { padding-left: 1rem; padding-right: 1rem; }
    .logo { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Our List <span>✦</span></div>
  <div class="sync-label"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Connecting…</span></div>
  <div class="header-stats" id="header-stats"></div>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search…" oninput="render()">
  <select id="filter-cat" onchange="render()">
    <option value="">All categories</option>
    <option value="food">Dining & Food</option>
    <option value="outdoor">Outdoor</option>
    <option value="travel">Travel</option>
    <option value="indoor">Indoor / Culture</option>
    <option value="adventure">Adventure</option>
    <option value="art">Art & Music</option>
    <option value="other">Other</option>
  </select>
  <select id="filter-done" onchange="render()">
    <option value="">All items</option>
    <option value="false">Not done</option>
    <option value="true">Done ✓</option>
  </select>
  <select id="filter-pri" onchange="render()">
    <option value="">All priorities</option>
    <option value="High">High</option>
    <option value="Medium">Medium</option>
    <option value="Someday">Someday</option>
  </select>
  <div class="lang-toggle">
    <button onclick="setLang('en')" id="lt-en" class="active">EN</button>
    <button onclick="setLang('ja')" id="lt-ja">JA</button>
    <button onclick="setLang('ru')" id="lt-ru">RU</button>
  </div>
  <button class="btn-add" onclick="openModal()">＋ Add item</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th style="width:36px;"></th>
        <th onclick="sortBy('title_en')">Title <span class="sort-arrow" id="sa-title_en"></span></th>
        <th onclick="sortBy('category')">Category <span class="sort-arrow" id="sa-category"></span></th>
        <th onclick="sortBy('priority')">Priority <span class="sort-arrow" id="sa-priority"></span></th>
        <th onclick="sortBy('season')">Season <span class="sort-arrow" id="sa-season"></span></th>
        <th onclick="sortBy('budget')">Budget <span class="sort-arrow" id="sa-budget"></span></th>
        <th onclick="sortBy('proposer')">By <span class="sort-arrow" id="sa-proposer"></span></th>
        <th>Location</th>
        <th>Ref / memo</th>
        <th onclick="sortBy('done_date')">Done <span class="sort-arrow" id="sa-done_date"></span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────
  const firebaseConfig = {
    apiKey: "REPLACE_WITH_YOUR_API_KEY",
    authDomain: "REPLACE_WITH_YOUR_AUTH_DOMAIN",
    databaseURL: "REPLACE_WITH_YOUR_DATABASE_URL",
    projectId: "REPLACE_WITH_YOUR_PROJECT_ID",
    storageBucket: "REPLACE_WITH_YOUR_STORAGE_BUCKET",
    messagingSenderId: "REPLACE_WITH_YOUR_MESSAGING_SENDER_ID",
    appId: "REPLACE_WITH_YOUR_APP_ID"
  };
  // ─────────────────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const itemsRef = ref(db, 'bucketlist/items');

  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');

  window._fbSet = async (id, data) => {
    dot.className = 'sync-dot syncing'; lbl.textContent = 'Saving…';
    await set(ref(db, 'bucketlist/items/' + id), data);
    dot.className = 'sync-dot connected'; lbl.textContent = 'Synced';
  };
  window._fbRemove = async (id) => {
    dot.className = 'sync-dot syncing'; lbl.textContent = 'Saving…';
    await remove(ref(db, 'bucketlist/items/' + id));
    dot.className = 'sync-dot connected'; lbl.textContent = 'Synced';
  };
  window._fbPush = async (data) => {
    dot.className = 'sync-dot syncing'; lbl.textContent = 'Saving…';
    const newRef = push(itemsRef);
    await set(newRef, { ...data, id: newRef.key });
    dot.className = 'sync-dot connected'; lbl.textContent = 'Synced';
    return newRef.key;
  };

  onValue(itemsRef, (snapshot) => {
    const val = snapshot.val();
    window._items = val ? Object.values(val) : [];
    dot.className = 'sync-dot connected'; lbl.textContent = 'Live ✓';
    render();
  });
</script>

<script>
const CATS = {
  food:      { label: 'Dining & Food',    bg: 'var(--cat-food)',      t: 'var(--cat-food-t)' },
  outdoor:   { label: 'Outdoor',          bg: 'var(--cat-outdoor)',   t: 'var(--cat-outdoor-t)' },
  travel:    { label: 'Travel',           bg: 'var(--cat-travel)',    t: 'var(--cat-travel-t)' },
  indoor:    { label: 'Indoor / Culture', bg: 'var(--cat-indoor)',    t: 'var(--cat-indoor-t)' },
  adventure: { label: 'Adventure',        bg: 'var(--cat-adventure)', t: 'var(--cat-adventure-t)' },
  art:       { label: 'Art & Music',      bg: 'var(--cat-art)',       t: 'var(--cat-art-t)' },
  other:     { label: 'Other',            bg: 'var(--cat-other)',     t: 'var(--cat-other-t)' },
};
const SEASONS = ['Any time','Spring','Summer','Autumn','Winter'];
const PRIS    = ['High','Medium','Someday'];
const PROPS   = ['Asuka','Stepan','Both'];

window._items = [];
let displayLang = 'en';
let sortKey = '', sortDir = 1;
let editingId = null;
let translateTimer = null;

function setLang(l) {
  displayLang = l;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('lt-' + l).classList.add('active');
  render();
}

function sortBy(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  document.querySelectorAll('.sort-arrow').forEach(e => e.textContent = '');
  const el = document.getElementById('sa-' + key);
  if (el) el.textContent = sortDir === 1 ? ' ↑' : ' ↓';
  render();
}

function getFiltered() {
  const q  = document.getElementById('search').value.toLowerCase();
  const fc = document.getElementById('filter-cat').value;
  const fd = document.getElementById('filter-done').value;
  const fp = document.getElementById('filter-pri').value;
  return _items.filter(it => {
    if (fc && it.category !== fc) return false;
    if (fd !== '' && String(it.done) !== fd) return false;
    if (fp && it.priority !== fp) return false;
    if (q && !(it.title_en + it.title_ja + it.title_ru + (it.location||'') + (it.memo||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}

function getSorted(arr) {
  if (!sortKey) return arr;
  const priOrder = { High: 0, Medium: 1, Someday: 2 };
  return [...arr].sort((a, b) => {
    let av = a[sortKey] ?? '', bv = b[sortKey] ?? '';
    if (sortKey === 'priority') { av = priOrder[av] ?? 9; bv = priOrder[bv] ?? 9; return sortDir * (av - bv); }
    if (sortKey === 'budget') return sortDir * (av - bv);
    return sortDir * String(av).localeCompare(String(bv));
  });
}

function budgetDots(n) { return '●'.repeat(n) + '○'.repeat(5 - n); }
function titleKey()    { return 'title_' + displayLang; }

function render() {
  const rows = getSorted(getFiltered());
  const tbody = document.getElementById('tbody');

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state"><div class="em-title">Nothing here yet</div>Add your first dream together ✦</div></td></tr>`;
    updateStats(); return;
  }

  tbody.innerHTML = rows.map(it => {
    const cat = CATS[it.category] || CATS.other;
    const title = it[titleKey()] || it.title_en || '—';
    return `<tr class="${it.done ? 'done' : ''}">
      <td class="no-strike"><input type="checkbox" ${it.done ? 'checked' : ''} onchange="toggleDone('${it.id}')" style="accent-color:var(--accent);width:15px;height:15px;cursor:pointer;"></td>
      <td>
        <div class="item-title">${title}</div>
        ${it.location ? `<div class="item-sub">📍 ${it.location}</div>` : ''}
      </td>
      <td><span class="cat-pill" style="background:${cat.bg};color:${cat.t};">${cat.label}</span></td>
      <td><span class="pri-pill pri-${it.priority}">${it.priority}</span></td>
      <td><span class="season-chip">${it.season || '—'}</span></td>
      <td><span class="budget-dots" title="${it.budget}/5">${budgetDots(it.budget)}</span></td>
      <td><span class="prop-pill prop-${it.proposer}">${it.proposer}</span></td>
      <td><span class="loc-text">${it.location || '—'}</span></td>
      <td>
        ${it.url ? `<a class="url-link" href="${it.url}" target="_blank">🔗 Link</a>` : ''}
        ${it.memo ? `<div class="memo-text" title="${it.memo}">💬 ${it.memo}</div>` : ''}
      </td>
      <td class="no-strike"><span class="done-date">${it.done_date || ''}</span></td>
      <td class="no-strike" style="white-space:nowrap;">
        <button class="btn-icon" onclick="openModal('${it.id}')" title="Edit">✏️</button>
        <button class="btn-icon" onclick="deleteItem('${it.id}')" title="Delete">🗑</button>
      </td>
    </tr>`;
  }).join('');
  updateStats();
}

function updateStats() {
  const total = _items.length;
  const done  = _items.filter(x => x.done).length;
  const high  = _items.filter(x => x.priority === 'High' && !x.done).length;
  document.getElementById('header-stats').innerHTML = `
    <div class="hstat"><div class="hstat-num">${total}</div><div class="hstat-label">Total</div></div>
    <div class="hstat"><div class="hstat-num">${done}</div><div class="hstat-label">Done</div></div>
    <div class="hstat"><div class="hstat-num">${total - done}</div><div class="hstat-label">Remaining</div></div>
    <div class="hstat"><div class="hstat-num">${high}</div><div class="hstat-label">High priority</div></div>
  `;
}

async function toggleDone(id) {
  const it = _items.find(x => x.id === id);
  if (!it) return;
  it.done = !it.done;
  it.done_date = it.done ? new Date().toISOString().slice(0, 10) : '';
  await window._fbSet(id, it);
}

async function deleteItem(id) {
  if (!confirm('Remove this item?')) return;
  await window._fbRemove(id);
}

function openModal(id = null) {
  editingId = id;
  const it = id ? _items.find(x => x.id === id) : null;
  document.getElementById('modal-inner').innerHTML = `
    <h2>${id ? 'Edit item' : 'Add new item'}</h2>
    <div class="form-row">
      <label>Title — type in any language, the other two auto-translate</label>
      <div class="translate-grid">
        <div>
          <small style="font-size:11px;color:var(--text3);">English</small>
          <input type="text" id="f-en" value="${it ? (it.title_en || '') : ''}" placeholder="English" oninput="scheduleTranslate('en')">
          <div class="tl-status" id="tl-en"></div>
        </div>
        <div>
          <small style="font-size:11px;color:var(--text3);">日本語</small>
          <input type="text" id="f-ja" value="${it ? (it.title_ja || '') : ''}" placeholder="日本語" oninput="scheduleTranslate('ja')">
          <div class="tl-status" id="tl-ja"></div>
        </div>
        <div>
          <small style="font-size:11px;color:var(--text3);">Русский</small>
          <input type="text" id="f-ru" value="${it ? (it.title_ru || '') : ''}" placeholder="Русский" oninput="scheduleTranslate('ru')">
          <div class="tl-status" id="tl-ru"></div>
        </div>
      </div>
    </div>
    <div class="form-2col">
      <div class="form-row">
        <label>Category</label>
        <select id="f-cat">
          ${Object.entries(CATS).map(([k,v]) => `<option value="${k}" ${it && it.category === k ? 'selected' : ''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Priority</label>
        <select id="f-pri">${PRIS.map(p => `<option value="${p}" ${it && it.priority === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <label>Season</label>
        <select id="f-season">${SEASONS.map(s => `<option value="${s}" ${it && it.season === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <label>Proposed by</label>
        <select id="f-prop">${PROPS.map(p => `<option value="${p}" ${it && it.proposer === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <label>Budget (1–5)</label>
        <select id="f-budget">${[1,2,3,4,5].map(b => `<option value="${b}" ${it && it.budget === b ? 'selected' : ''}>${'●'.repeat(b)} (${b})</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <label>Location / city</label>
        <input type="text" id="f-loc" value="${it ? (it.location || '') : ''}" placeholder="e.g. Kyoto, Japan">
      </div>
    </div>
    <div class="form-row">
      <label>Reference URL</label>
      <input type="text" id="f-url" value="${it ? (it.url || '') : ''}" placeholder="https://...">
    </div>
    <div class="form-row">
      <label>Memo / notes</label>
      <textarea id="f-memo">${it ? (it.memo || '') : ''}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveItem()">Save</button>
    </div>
  `;
  document.getElementById('modal-bg').classList.add('open');
}

function closeModal() { document.getElementById('modal-bg').classList.remove('open'); }

function scheduleTranslate(lang) {
  clearTimeout(translateTimer);
  const val = (document.getElementById('f-' + lang) || {}).value?.trim();
  if (!val) return;
  ['en','ja','ru'].filter(l => l !== lang).forEach(l => {
    const el = document.getElementById('tl-' + l); if (el) el.textContent = 'translating…';
  });
  translateTimer = setTimeout(() => doTranslate(lang, val), 800);
}

async function doTranslate(fromLang, text) {
  const names = { en: 'English', ja: 'Japanese', ru: 'Russian' };
  const targets = ['en','ja','ru'].filter(l => l !== fromLang);
  const prompt = `Translate the following text into ${targets.map(l => names[l]).join(' and ')}. Reply ONLY with a JSON object like {"${targets[0]}":"...","${targets[1]}":"..."} with no extra text.\n\nText: ${text}`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 300, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const raw = data.content.map(x => x.text || '').join('').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(raw);
    targets.forEach(l => {
      const inp = document.getElementById('f-' + l);
      const tl  = document.getElementById('tl-' + l);
      if (inp && parsed[l]) inp.value = parsed[l];
      if (tl) tl.textContent = '';
    });
  } catch(e) {
    targets.forEach(l => { const tl = document.getElementById('tl-' + l); if (tl) tl.textContent = ''; });
  }
}

async function saveItem() {
  const en = (document.getElementById('f-en').value || '').trim();
  const ja = (document.getElementById('f-ja').value || '').trim();
  const ru = (document.getElementById('f-ru').value || '').trim();
  if (!en && !ja && !ru) { alert('Please enter a title in at least one language.'); return; }
  const existing = editingId ? _items.find(x => x.id === editingId) : null;
  const obj = {
    id:        editingId || null,
    title_en:  en, title_ja: ja, title_ru: ru,
    category:  document.getElementById('f-cat').value,
    priority:  document.getElementById('f-pri').value,
    season:    document.getElementById('f-season').value,
    budget:    parseInt(document.getElementById('f-budget').value) || 1,
    proposer:  document.getElementById('f-prop').value,
    location:  document.getElementById('f-loc').value.trim(),
    url:       document.getElementById('f-url').value.trim(),
    memo:      document.getElementById('f-memo').value.trim(),
    done:      existing ? existing.done : false,
    done_date: existing ? (existing.done_date || '') : '',
  };
  closeModal();
  if (editingId) {
    await window._fbSet(editingId, obj);
  } else {
    await window._fbPush(obj);
  }
}
